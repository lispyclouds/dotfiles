active_border_color #000000
background_opacity 0.95
cursor_shape block
cursor_trail 3
cursor_trail_decay 0.1 0.4
enabled_layouts splits
font_family Iosevka Term Semibold
inactive_text_alpha 0.6
map ctrl+s launch --location=hsplit --cwd=current
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+backspace combine : clear_terminal scroll active : clear_terminal scrollback active
map ctrl+shift+f launch --type=overlay --stdin-source=@screen_scrollback nvim -R +"set buftype=nofile" +"noremap q ZQ" -
map ctrl+shift+h previous_window
map ctrl+shift+l next_window
map ctrl+shift+s launch --location=vsplit --cwd=current
progress_bar hidden
tab_bar_style powerline
tab_powerline_style round
window_padding_width 4

# https://github.com/mellow-theme/kitty/blob/master/mellow.conf
cursor #e3e2e5
foreground #c9c7cd
background #161617
selection_foreground #e3e2e5
selection_background #3C3B3E
# Black
color0  #27272a
color8  #353539
# Red
color1  #f5a191
color9  #ffae9f
# Green
color2  #90b99f
color10 #9dc6ac
# Yellow
color3  #e6b99d
color11 #f0c5a9
# Blue
color4  #aca1cf
color12 #b9aeda
# Magenta
color5  #e29eca
color13 #ecaad6
# Cyan
color6  #ea83a5
color14 #f591b2
# White
color7  #c1c0d4
color15 #cac9dd

active_tab_foreground   #cac9dd
active_tab_background   #353539
inactive_tab_foreground #57575f
inactive_tab_background #1b1b1d

active_border_color   #57575f
inactive_border_color #2a2a2d
inactive_text_alpha
